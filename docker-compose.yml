version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: codecollab-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: codecollab
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/src/db/schema.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7-alpine
    container_name: codecollab-redis
    restart: always
    ports:
      - "6379:6379"

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: codecollab-server
    restart: always
    environment:
      PORT: 1234
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/codecollab
      REDIS_URL: redis://redis:6379
      JWT_SECRET: production_jwt_secret_key_2026
    ports:
      - "1234:1234"
    depends_on:
      - postgres
      - redis

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: codecollab-client
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - server

volumes:
  pgdata:
